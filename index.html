<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Exhibit Digital Label Prototype</title>
<style>
  :root{
    --page:#f4f7f8;
    --panel:#ffffff;
    --panel2:#f7fafb;
    --text:#101418;
    --muted:#66737d;
    --line:rgba(16,20,24,.13);
    --brand:#00aaa6;
    --brand-soft:rgba(0,170,166,.12);
    --brand-soft-2:rgba(0,170,166,.08);
    --brand-contrast:#ffffff;
    --danger:#d64545;
    --shadow:0 16px 44px rgba(20,38,52,.12);
    --shadow-soft:0 6px 20px rgba(20,38,52,.075);
    --r:clamp(18px,2vw,28px);
    --pad:clamp(10px,1.35vw,18px);
    --gap:clamp(10px,1.35vw,18px);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--page);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{
    background:
      radial-gradient(circle at 20% 10%, var(--brand-soft), transparent 36%),
      radial-gradient(circle at 78% 92%, rgba(16,20,24,.055), transparent 36%),
      linear-gradient(135deg,#ffffff,#f4f7f8 52%,#edf3f4);
  }
  button,input,textarea,select{font:inherit}
  button{border:0;cursor:pointer;color:inherit}
  .app{
    height:100%;
    display:grid;
    grid-template-columns:clamp(74px,8vw,104px) minmax(0,1fr);
    gap:var(--gap);
    padding:var(--pad);
    min-width:0;
  }
  .rail{
    min-width:0;
    border:1px solid var(--line);
    border-radius:clamp(18px,1.8vw,24px);
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(18px);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(8px,1vw,14px) clamp(6px,.8vw,10px);
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .brand{
    width:clamp(54px,6vw,74px);
    height:clamp(54px,6vw,74px);
    border-radius:clamp(16px,1.7vw,22px);
    display:grid;place-items:center;
    background:linear-gradient(145deg,var(--brand-soft),rgba(255,255,255,.92));
    border:1px solid color-mix(in srgb, var(--brand) 38%, transparent);
    color:var(--brand);
    font-weight:950;
    letter-spacing:.025em;
    font-size:clamp(9px,.9vw,13px);
    user-select:none;
    text-align:center;
    overflow:hidden;
    line-height:1.05;
  }
  .productDots{
    display:flex;
    flex-direction:column;
    gap:clamp(8px,1vw,12px);
    margin-top:clamp(14px,2.2vw,28px);
    width:100%;
    align-items:center;
    min-width:0;
  }
  .dot{
    width:100%;
    max-width:76px;
    min-height:clamp(48px,5vw,58px);
    border-radius:clamp(14px,1.5vw,18px);
    background:#fff;
    border:1px solid var(--line);
    display:grid;
    place-items:center;
    text-align:center;
    padding:6px 5px;
    color:var(--muted);
    font-size:clamp(8px,.82vw,10.5px);
    line-height:1.1;
    box-shadow:var(--shadow-soft);
    overflow:hidden;
    word-break:break-word;
    overflow-wrap:anywhere;
    hyphens:auto;
  }
  .dot.active{background:var(--brand-soft);border-color:color-mix(in srgb, var(--brand) 55%, transparent);color:var(--text)}
  .railFooter{margin-top:auto;color:rgba(16,20,24,.38);font-size:clamp(8px,.72vw,10px);text-align:center;line-height:1.3;user-select:none}
  .hiddenHotspot{position:absolute;right:0;top:0;width:80px;height:80px;z-index:5}
  .screen{min-width:0;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--gap)}
  .topbar{
    min-height:clamp(76px,8vw,104px);
    border:1px solid var(--line);
    border-radius:var(--r);
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(18px);
    box-shadow:var(--shadow);
    padding:clamp(12px,1.35vw,18px) clamp(14px,1.8vw,24px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:clamp(12px,1.5vw,18px);
    min-width:0;
    overflow:hidden;
  }
  .crumb{
    color:var(--muted);
    font-size:clamp(10px,1.05vw,14px);
    text-transform:uppercase;
    letter-spacing:.12em;
    font-weight:850;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .titleWrap{min-width:0;flex:1 1 auto}
  .title{
    font-size:clamp(20px,2.45vw,36px);
    font-weight:950;
    line-height:1.16;
    margin-top:3px;
    white-space:normal;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    text-overflow:ellipsis;
    padding-block:2px 4px;
    word-break:normal;
  }
  .dmoc{
    flex:0 0 auto;
    border-radius:clamp(18px,1.8vw,24px);
    padding:clamp(10px,1.2vw,14px) clamp(12px,1.45vw,18px);
    min-width:clamp(150px,17vw,205px);
    text-align:right;
    background:linear-gradient(145deg,var(--brand-soft),rgba(255,255,255,.94));
    border:1px solid color-mix(in srgb, var(--brand) 48%, transparent);
    box-shadow:var(--shadow-soft);
  }
  .dmocLabel{font-size:clamp(9px,.9vw,12px);color:var(--brand);font-weight:950;letter-spacing:.16em;text-transform:uppercase;line-height:1.2}
  .dmocValue{font-size:clamp(20px,2.6vw,38px);font-weight:950;line-height:1.08;margin-top:5px;color:#0c1114;white-space:nowrap}
  .main{
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);
    gap:var(--gap);
    min-width:0;
  }
  .hero,.info{
    min-width:0;
    min-height:0;
    border:1px solid var(--line);
    border-radius:var(--r);
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(18px);
    box-shadow:var(--shadow);
    overflow:hidden;
  }

  .hero{display:grid;grid-template-rows:minmax(0,1fr) clamp(100px,13vw,132px);position:relative}
  .imageStage{
    min-height:0;
    display:grid;
    place-items:center;
    padding:clamp(14px,1.8vw,24px);
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 52% 35%, var(--brand-soft-2), transparent 30%),
      linear-gradient(180deg,#ffffff,#f3f7f8 100%);
  }
  .productImage{
    max-width:92%;
    max-height:100%;
    object-fit:contain;
    filter:drop-shadow(0 24px 36px rgba(19,34,44,.23));
    transition:transform .25s ease, opacity .2s ease;
    user-select:none;
  }
  .productImage.bump{transform:scale(.985);opacity:.72}
  .fridgeFallback{
    width:min(42vh,340px,72%);
    height:min(68vh,540px,92%);
    border-radius:30px;background:
      linear-gradient(90deg,rgba(255,255,255,.35),transparent 14%,rgba(255,255,255,.32) 49%,transparent 52%,rgba(0,0,0,.08) 100%),
      linear-gradient(135deg,#f2f6f7,#a9b8bd 44%,#61747c);
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.55),
      inset 0 0 70px rgba(0,0,0,.09),
      0 30px 70px rgba(19,34,44,.25);
    position:relative;
    transform:perspective(900px) rotateY(-5deg);
  }
  .fridgeFallback:before,.fridgeFallback:after{content:"";position:absolute;background:rgba(16,20,24,.20)}
  .fridgeFallback:before{left:50%;top:0;bottom:0;width:2px}
  .fridgeFallback:after{left:8%;right:8%;top:50%;height:2px}
  .handle{position:absolute;left:50%;top:10%;bottom:10%;width:5px;background:rgba(255,255,255,.35);border-radius:20px;transform:translateX(-14px)}
  .displayMock{
    position:absolute;left:50%;top:28%;width:74px;height:112px;transform:translateX(-50%);
    border-radius:16px;background:linear-gradient(180deg,#07171c,#102a31);
    border:1px solid color-mix(in srgb, var(--brand) 70%, transparent);
    box-shadow:0 0 24px var(--brand-soft);
    display:grid;place-items:center;color:var(--brand);font-size:10px;font-weight:950;text-align:center;padding:8px
  }
  .heroBadge{
    position:absolute;
    left:clamp(14px,1.8vw,24px);
    top:clamp(14px,1.8vw,24px);
    max-width:calc(100% - 28px);
    border-radius:999px;
    padding:clamp(7px,.9vw,10px) clamp(10px,1vw,13px);
    background:#fff;
    border:1px solid color-mix(in srgb, var(--brand) 46%, transparent);
    color:var(--brand);
    font-weight:950;
    font-size:clamp(9px,.9vw,12px);
    line-height:1.1;
    letter-spacing:.08em;
    text-transform:uppercase;
    z-index:3;
    box-shadow:var(--shadow-soft);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .galleryDock{
    min-width:0;
    display:grid;
    grid-template-columns:clamp(50px,5.6vw,70px) minmax(0,1fr) clamp(50px,5.6vw,70px);
    gap:clamp(8px,1vw,12px);
    align-items:center;
    padding:clamp(10px,1.15vw,14px);
    border-top:1px solid var(--line);
    background:#ffffff;
  }
  .galleryArrow{
    height:clamp(70px,8.4vw,88px);
    border-radius:clamp(16px,1.7vw,22px);
    background:var(--brand);
    border:1px solid color-mix(in srgb, var(--brand) 72%, #000 10%);
    box-shadow:0 10px 24px color-mix(in srgb, var(--brand) 16%, transparent), inset 0 1px 0 rgba(255,255,255,.32);
    color:var(--brand-contrast);
    font-size:clamp(28px,3.1vw,36px);
    line-height:1;
    font-weight:950;
    display:grid;
    place-items:center;
  }
  .galleryArrow:active{transform:translateY(1px);filter:brightness(.96)}
  .thumbStrip{
    min-width:0;
    height:clamp(78px,9vw,96px);
    display:flex;
    gap:clamp(8px,1vw,12px);
    overflow-x:auto;
    overflow-y:hidden;
    scroll-behavior:smooth;
    padding:2px 1px 8px;
  }
  .thumbStrip::-webkit-scrollbar{height:5px}
  .thumbStrip::-webkit-scrollbar-thumb{background:rgba(16,20,24,.16);border-radius:999px}
  .galleryThumb{
    flex:0 0 clamp(86px,10vw,116px);
    height:clamp(68px,7.8vw,84px);
    border-radius:clamp(15px,1.6vw,20px);
    background:#fff;
    border:1px solid var(--line);
    overflow:hidden;
    display:grid;
    place-items:center;
    padding:0;
    position:relative;
    box-shadow:var(--shadow-soft);
  }
  .galleryThumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .galleryThumb.active{
    border-color:color-mix(in srgb, var(--brand) 86%, transparent);
    box-shadow:0 0 0 2px color-mix(in srgb, var(--brand) 20%, transparent), 0 8px 22px color-mix(in srgb, var(--brand) 10%, transparent);
  }
  .galleryThumb.active:after{
    content:"";
    position:absolute;
    left:12px;right:12px;bottom:7px;height:4px;
    border-radius:999px;
    background:var(--brand);
  }

  .info{display:grid;grid-template-rows:auto minmax(0,1fr)}
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:clamp(7px,.9vw,10px);
    padding:clamp(11px,1.2vw,16px);
    border-bottom:1px solid var(--line);
    background:#fff;
    min-width:0;
  }
  .tab{
    border-radius:999px;
    padding:clamp(9px,1vw,12px) clamp(11px,1.2vw,16px);
    background:#fff;
    border:1px solid var(--line);
    font-weight:950;
    color:var(--muted);
    box-shadow:var(--shadow-soft);
    font-size:clamp(12px,1.05vw,16px);
    line-height:1.1;
  }
  .tab.active{background:var(--brand);border-color:var(--brand);color:var(--brand-contrast)}
  .pane{min-height:0;overflow:auto;padding:clamp(14px,1.65vw,22px);background:#fff}
  .pane::-webkit-scrollbar{width:8px}.pane::-webkit-scrollbar-thumb{background:rgba(16,20,24,.18);border-radius:999px}
  .lead{font-size:clamp(15px,1.45vw,22px);line-height:1.42;color:#1d262c;margin:0 0 clamp(12px,1.4vw,18px)}
  .features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(9px,1vw,12px)}
  .feature{
    min-width:0;
    border-radius:clamp(16px,1.7vw,22px);
    background:linear-gradient(145deg,#ffffff,#f7fafb);
    border:1px solid var(--line);
    padding:clamp(12px,1.25vw,16px);
    min-height:clamp(104px,11vw,120px);
    box-shadow:var(--shadow-soft);
    overflow:hidden;
  }
  .feature b{display:block;font-size:clamp(15px,1.35vw,18px);line-height:1.18;margin-bottom:8px;color:#111827}
  .feature b:before{content:"";display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--brand);margin-right:9px;vertical-align:1px}
  .feature span{color:var(--muted);line-height:1.35;font-size:clamp(13px,1.08vw,16px)}
  .specGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1vw,12px)}
  .spec{
    min-width:0;
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:clamp(10px,1.05vw,13px) clamp(11px,1.1vw,14px);
    border-radius:clamp(13px,1.4vw,16px);
    background:#fff;
    border:1px solid var(--line);
    box-shadow:var(--shadow-soft);
    font-size:clamp(12px,1.02vw,16px);
    line-height:1.25;
  }
  .spec .k{color:var(--muted);min-width:0}.spec .v{font-weight:950;text-align:right;color:#101418;min-width:0;overflow-wrap:anywhere}
  .videoBox{
    height:100%;
    min-height:300px;
    border-radius:24px;
    background:#f4f7f8;
    border:1px solid var(--line);
    display:grid;
    place-items:center;
    overflow:hidden
  }
  video{width:100%;height:100%;object-fit:contain;background:#000}
  .emptyVideo{text-align:center;color:var(--muted);padding:30px;line-height:1.4}
  .emptyVideo b{display:block;color:var(--text);font-size:clamp(20px,2vw,26px);margin-bottom:8px}
  .adminOverlay{
    position:fixed;inset:0;background:rgba(16,20,24,.42);backdrop-filter:blur(12px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:clamp(12px,2vw,24px)
  }
  .adminOverlay.open{display:flex}
  .modal{
    width:min(1100px,calc(100vw - 24px));max-height:calc(100vh - 24px);
    border-radius:clamp(20px,2vw,30px);background:#fff;border:1px solid var(--line);
    box-shadow:0 36px 100px rgba(16,20,24,.28);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr)
  }
  .modalHead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff}
  .modalHead b{font-size:clamp(20px,2vw,24px)}
  .close{border-radius:999px;background:#f1f5f6;border:1px solid var(--line);padding:10px 14px;font-weight:950}
  .adminBody{min-height:0;overflow:auto;padding:clamp(12px,1.8vw,20px);display:grid;gap:18px;background:#f6f8f9}
  .adminGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .card{min-width:0;border-radius:24px;background:#fff;border:1px solid var(--line);padding:16px;box-shadow:var(--shadow-soft)}
  label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px;font-weight:850}
  input,textarea,select{
    width:100%;border-radius:14px;border:1px solid var(--line);background:#fff;
    color:var(--text);padding:12px 13px;outline:none;min-width:0
  }
  input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  textarea{min-height:92px;resize:vertical}
  .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .adminActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn{border-radius:16px;background:var(--brand);border:1px solid var(--brand);padding:12px 14px;font-weight:950;color:var(--brand-contrast)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.danger{background:#fff;border-color:rgba(214,69,69,.32);color:var(--danger)}
  .pinScreen{display:grid;gap:14px;max-width:380px;width:100%}
  .hint{color:var(--muted);font-size:13px;line-height:1.35}
  .brandPreview{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:13px}
  .brandSwatch{width:24px;height:24px;border-radius:999px;background:var(--brand);border:1px solid rgba(0,0,0,.12)}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:#101418;border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:12px 16px;
    color:#fff;font-weight:850;z-index:80;transition:.25s ease
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:1180px){
    .app{grid-template-columns:76px minmax(0,1fr)}
    .main{grid-template-columns:minmax(0,.96fr) minmax(0,1.04fr)}
    .title{font-size:clamp(19px,2.25vw,30px)}
    .dmoc{min-width:145px}
    .features{grid-template-columns:1fr}
  }
  @media (max-width:960px){
    html,body{overflow:auto}
    .app{min-height:100%;height:auto;grid-template-columns:1fr;grid-template-rows:auto auto;padding:10px}
    .rail{flex-direction:row;min-height:76px}
    .brand{width:58px;height:58px}
    .productDots{flex-direction:row;margin:0 0 0 12px;width:auto;overflow-x:auto;align-items:center}
    .dot{width:72px;flex:0 0 72px}
    .railFooter{margin-left:auto;margin-top:0;display:none}
    .screen{height:auto;min-height:calc(100vh - 96px)}
    .topbar{align-items:flex-start}
    .main{grid-template-columns:1fr;grid-template-rows:minmax(420px,52vh) auto}
    .hero{min-height:420px}
    .info{min-height:420px}
    .features{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:720px){
    .topbar{display:grid;grid-template-columns:1fr;gap:10px}
    .dmoc{width:100%;text-align:left}
    .main{grid-template-rows:minmax(380px,52vh) auto}
    .features,.specGrid,.adminGrid,.row{grid-template-columns:1fr}
    .galleryDock{grid-template-columns:48px minmax(0,1fr) 48px}
    .galleryArrow{height:64px}
  }

  /* v0.5: tighter bottom gallery so it never bleeds under the browser/taskbar */
  html,body{
    height:100dvh;
    max-height:100dvh;
  }
  .app{
    height:100dvh;
    max-height:100dvh;
    overflow:hidden;
  }
  .screen,.main,.hero,.info{
    min-height:0;
  }
  .hero{
    grid-template-rows:minmax(0,1fr) clamp(76px,9.2vw,104px);
  }
  .galleryDock{
    grid-template-columns:clamp(44px,5vw,60px) minmax(0,1fr) clamp(44px,5vw,60px);
    padding:clamp(6px,.8vw,10px);
    gap:clamp(7px,.8vw,10px);
    min-height:0;
    overflow:hidden;
  }
  .galleryArrow{
    height:clamp(54px,6.2vw,68px);
    border-radius:clamp(14px,1.4vw,18px);
    font-size:clamp(24px,2.7vw,32px);
  }
  .thumbStrip{
    height:clamp(62px,7.3vw,82px);
    padding:1px 1px 5px;
    align-items:center;
  }
  .galleryThumb{
    flex-basis:clamp(76px,8.5vw,100px);
    height:clamp(56px,6.5vw,72px);
    border-radius:clamp(13px,1.4vw,18px);
  }
  .galleryThumb.active:after{
    left:10px;
    right:10px;
    bottom:5px;
    height:3px;
  }
  .imageStage{
    padding-bottom:clamp(10px,1vw,16px);
  }

  @media (max-width:1180px){
    .hero{
      grid-template-rows:minmax(0,1fr) clamp(72px,8.5vw,94px);
    }
    .galleryArrow{
      height:clamp(50px,5.8vw,62px);
    }
    .thumbStrip{
      height:clamp(58px,6.9vw,74px);
    }
    .galleryThumb{
      flex-basis:clamp(72px,8vw,92px);
      height:clamp(52px,6.1vw,66px);
    }
  }
  @media (max-width:960px){
    html,body{overflow:hidden}
    .app{
      height:100dvh;
      min-height:0;
      grid-template-rows:auto minmax(0,1fr);
    }
    .screen{
      height:100%;
      min-height:0;
    }
    .main{
      grid-template-rows:minmax(0,1fr) minmax(0,1fr);
    }
    .hero{
      min-height:0;
    }
    .info{
      min-height:0;
    }
  }

let state = {

  deviceSettings: loadDeviceSettings(),
  apiStatus: {

    lastError: null,
    source: "local-cache"
  },
  current: 0,
  tab: "overview",
  pin: localStorage.getItem("adminPin") || DEFAULT_PIN,
  adminUnlocked: false,
  tapCount: 0,
  tapTimer: null
};

function migrateProducts(products){
  return products.map(p => normalizeProductForApp(p));
}
function normalizeProductForApp(p){
  const out = {...p};
  if(!out.brand) out.brand = "Hisense";
  if(!out.url && out.source_url) out.url = out.source_url;
  if(!out.source_url && out.url) out.source_url = out.url;
  if(typeof out.sortOrder !== "number" && typeof out.sort_order === "number") out.sortOrder = out.sort_order;
  if(!Array.isArray(out.features)) out.features = [];
  if(!Array.isArray(out.specs)) out.specs = [];
  if(!Array.isArray(out.images) && Array.isArray(out.thumbs)){
    out.images = out.thumbs.map((label, i) => ({label, url: seedProducts[0].images[i]?.url || ""}));
  }
  if(!Array.isArray(out.images)) out.images = [];
  if(typeof out.imageIndex !== "number") out.imageIndex = 0;
  return out;
}
function loadProducts(){
  try {
    const raw = JSON.parse(localStorage.getItem("products_cache_v11") || "null");
    return raw ? migrateProducts(raw) : seedProducts;
  }
  catch(e){ return seedProducts; }
}
function saveProducts(){
  localStorage.setItem("products_cache_v11", JSON.stringify(state.products));
}
function loadDeviceSettings(){
  try {
    const raw = JSON.parse(localStorage.getItem("device_settings_v11") || "null");
    return raw ? {...DEFAULT_DEVICE_SETTINGS, ...raw} : {...DEFAULT_DEVICE_SETTINGS};
  }
  catch(e){ return {...DEFAULT_DEVICE_SETTINGS}; }
}
function saveDeviceSettings(){
  localStorage.setItem("device_settings_v11", JSON.stringify(state.deviceSettings));
}
function uniqueBrands(){
  return [...new Set(state.products.map(p => p.brand).filter(Boolean))];
}
function uniqueCategories(){
  return [...new Set(state.products.map(p => p.category).filter(Boolean))];
}
function productMatchesDeviceSettings(p){
  const s = state.deviceSettings || DEFAULT_DEVICE_SETTINGS;
  const brands = Array.isArray(s.brands) ? s.brands : [];
  const categories = Array.isArray(s.categories) ? s.categories : [];
  const productIds = Array.isArray(s.productIds) ? s.productIds : [];

  if(s.displayMode === "brand"){
    return brands.length ? brands.includes(p.brand) : true;
  }
  if(s.displayMode === "category"){
    return categories.length ? categories.includes(p.category) : true;
  }
  if(s.displayMode === "brandCategory"){
    const okBrand = brands.length ? brands.includes(p.brand) : true;
    const okCategory = categories.length ? categories.includes(p.category) : true;
    return okBrand && okCategory;
  }
  if(s.displayMode === "manual"){
    return productIds.includes(p.id);
  }
  return true;
}
function activeProducts(){
  const active = state.products.filter(p => p.active !== false);
  if(state.deviceSettings?.useSupabase) return active;
  return active.filter(productMatchesDeviceSettings);
}
function product(){
  const list = activeProducts();
  if(!list.length) return null;
  if(state.current >= list.length) state.current = 0;
  if(state.current < 0) state.current = 0;
  return list[state.current];
}
function productCountForSettings(settings){
  if(settings?.useSupabase) return state.products.filter(p => p.active !== false).length;
  const old = state.deviceSettings;
  state.deviceSettings = settings;
  const count = activeProducts().length;
  state.deviceSettings = old;
  return count;
}
function el(id){ return document.getElementById(id); }
function toast(msg){
  const t = el("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}
function applyBrand(brand){
  const data = BRAND_COLORS[brand] || BRAND_COLORS.Hisense;
  document.documentElement.style.setProperty("--brand", data.hex);
  document.documentElement.style.setProperty("--brand-soft", `rgba(${data.rgb},.12)`);
  document.documentElement.style.setProperty("--brand-soft-2", `rgba(${data.rgb},.08)`);
  el("brandHotspot").textContent = data.label.toUpperCase();
  if(data.label === "Mora") el("brandHotspot").textContent = "MORA";
}


async function loadRemoteConfig(showToast = true){
  const s = state.deviceSettings || DEFAULT_DEVICE_SETTINGS;
  if(!s.useSupabase){
    state.apiStatus.source = "local-mode";
    if(showToast) toast("Supabase sync je vypnutý, jedu lokálně.");
    return false;
  }

  const apiBase = (s.apiBase || DEFAULT_API_BASE).trim().replace(/\/+$/, "");
  const deviceId = (s.deviceId || DEFAULT_DEVICE_SETTINGS.deviceId).trim();

  if(!apiBase || !deviceId){
    state.apiStatus.lastError = "Chybí API URL nebo Device ID.";
    if(showToast) toast("Chybí API URL nebo Device ID.");
    return false;
  }

  try{
    const url = `${apiBase}?action=device-config&deviceId=${encodeURIComponent(deviceId)}`;
    const res = await fetch(url, {cache:"no-store"});
    const data = await res.json();

    if(!res.ok || !data.ok){
      throw new Error(data.error || `HTTP ${res.status}`);
    }

    const products = Array.isArray(data.products) ? data.products.map(normalizeProductForApp) : [];
    state.products = migrateProducts(products);

    if(data.device){
      state.deviceSettings.deviceName = data.device.name || state.deviceSettings.deviceName;
      state.deviceSettings.deviceId = data.device.id || state.deviceSettings.deviceId;
    }

    state.current = 0;
    state.apiStatus = {
      source: "supabase",
      profileName: data.profile?.name || data.device?.display_profiles?.name || "",
      lastSyncAt: new Date().toISOString(),
      lastError: null
    };

    localStorage.setItem("last_sync_v11", state.apiStatus.lastSyncAt);
    saveProducts();
    saveDeviceSettings();
    render();

    if(showToast) toast(`Načteno ze Supabase: ${state.products.length} produktů.`);
    return true;
  }catch(err){
    state.apiStatus.lastError = String(err?.message || err);
    state.apiStatus.source = "local-cache";
    render();
    if(showToast) toast(`Supabase sync selhal, jedu z cache.`);
    return false;
  }
}
function formatSyncTime(iso){
  if(!iso) return "zatím ne";
  try{
    return new Date(iso).toLocaleString("cs-CZ", {hour:"2-digit", minute:"2-digit", day:"2-digit", month:"2-digit"});
  }catch(e){
    return iso;
  }
}

function render(){
  const p = product();
  const fallbackBrand = (state.deviceSettings.brands && state.deviceSettings.brands[0]) || "Hisense";
  applyBrand((p && p.brand) || fallbackBrand);
  if(!p){
    el("category").textContent = state.deviceSettings.deviceName || "Tablet";
    el("title").textContent = "Žádné produkty pro tento profil";
    el("dmoc").textContent = "—";
    el("modelBadge").textContent = "EMPTY";
  } else {
    el("category").textContent = p.category || "Produkt";
    el("title").textContent = p.title || "Bez názvu";
    el("dmoc").textContent = p.dmoc || "—";
    el("modelBadge").textContent = p.model || p.id || "MODEL";
  }
  renderDots();
  renderGallery();
  renderPane();
}
function renderDots(){
  const dots = el("productDots");
  dots.innerHTML = "";
  const list = activeProducts();
  if(!list.length){
    const b = document.createElement("button");
    b.className = "dot active";
    b.textContent = "0 produktů";
    dots.appendChild(b);
    return;
  }
  list.forEach((p,i)=>{
    const b = document.createElement("button");
    b.className = "dot" + (i===state.current ? " active" : "");
    b.textContent = p.model || p.title || `Produkt ${i+1}`;
    b.onclick = () => { state.current = i; state.tab = "overview"; setActiveTab(); render(); };
    dots.appendChild(b);
  });
}
function safeImages(p){
  return Array.isArray(p.images) ? p.images.filter(x => x && x.url) : [];
}
function imageSrc(item){
  return typeof item === "string" ? item : item.url;
}
function imageLabel(item, idx){
  return (typeof item === "object" && item.label) ? item.label : `Obrázek ${idx + 1}`;
}
function renderGallery(){
  const p = product();
  const stage = el("imageStage");
  const fallback = el("fallbackFridge");
  if(!p){
    let img = el("mainProductImage");
    if(img) img.style.display = "none";
    fallback.style.display = "block";
    const strip = el("thumbStrip");
    strip.innerHTML = `<div class="hint" style="padding:18px 4px">V profilu tabletu není žádný odpovídající produkt. Uprav filtr v admin menu.</div>`;
    return;
  }
  const images = safeImages(p);
  if(typeof p.imageIndex !== "number") p.imageIndex = 0;
  if(p.imageIndex >= images.length) p.imageIndex = 0;

  let img = el("mainProductImage");
  if(images.length){
    if(!img){
      img = document.createElement("img");
      img.id = "mainProductImage";
      img.className = "productImage";
      img.alt = "Produktový obrázek";
      stage.appendChild(img);
    }
    img.src = imageSrc(images[p.imageIndex]);
    img.alt = imageLabel(images[p.imageIndex], p.imageIndex);
    img.style.display = "block";
    fallback.style.display = "none";
  } else {
    if(img) img.style.display = "none";
    fallback.style.display = "block";
  }

  const strip = el("thumbStrip");
  strip.innerHTML = "";
  if(images.length){
    images.forEach((item, i)=>{
      const b = document.createElement("button");
      b.className = "galleryThumb" + (i === p.imageIndex ? " active" : "");
      b.title = imageLabel(item, i);
      b.innerHTML = `<img src="${attr(imageSrc(item))}" alt="${attr(imageLabel(item, i))}" loading="lazy">`;
      b.onclick = () => setImageIndex(i);
      strip.appendChild(b);
    });
  } else {
    const empty = document.createElement("div");
    empty.className = "hint";
    empty.style.padding = "18px 4px";
    empty.textContent = "Zatím nejsou načtené žádné obrázky. Po napojení backendu tady budou miniatury z produktové stránky.";
    strip.appendChild(empty);
  }
}
function setImageIndex(i){
  const p = product();
  const images = safeImages(p);
  if(!images.length) return;
  p.imageIndex = (i + images.length) % images.length;
  const img = el("mainProductImage");
  if(img){
    img.classList.add("bump");
    setTimeout(()=>img.classList.remove("bump"), 160);
  }
  renderGallery();
  saveProducts();
}
function nextImage(step){
  const p = product();
  const images = safeImages(p);
  if(!images.length) return;
  setImageIndex((p.imageIndex || 0) + step);
}
el("prevImage").onclick = () => nextImage(-1);
el("nextImage").onclick = () => nextImage(1);

function renderPane(){
  const pane = el("pane");
  pane.scrollTop = 0;
  const p = product();
  if(!p){
    pane.innerHTML = `<div class="emptyState"><div><b>Žádné produkty k zobrazení</b><span>Tenhle tablet má nastavený filtr, který aktuálně neodpovídá žádnému aktivnímu produktu. Otevři admin menu a změň značku, kategorii nebo ruční výběr produktů.</span></div></div>`;
    setTimeout(updateScrollAid, 0);
    return;
  }
  if(state.tab === "overview"){
    pane.innerHTML = `
      <p class="lead">${escapeHtml(p.intro || "")}</p>
      <div class="features">
        ${(p.features||[]).map(f=>`
          <div class="feature">
            <b>${escapeHtml(f.title)}</b>
            <span>${escapeHtml(f.text)}</span>
          </div>
        `).join("")}
      </div>`;
  }
  if(state.tab === "specs"){
    pane.innerHTML = `<div class="specGrid">${
      (p.specs||[]).map(([k,v])=>`
        <div class="spec"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v)}</span></div>
      `).join("")
    }</div>`;
  }
  if(state.tab === "video"){
    renderVideoPane(pane, p);
  }
  setTimeout(updateScrollAid, 0);
}
async function renderVideoPane(pane, p){
  pane.innerHTML = `<div class="videoBox"><div class="emptyVideo"><b>Načítám video…</b><span>Mrkneme, jestli je k produktu uložený soubor.</span></div></div>`;
  if(!p.videoKey){
    pane.innerHTML = `<div class="videoBox"><div class="emptyVideo"><b>Video zatím není nahrané</b><span>V adminu můžeš ke konkrétnímu produktu přidat MP4 video. Pro výstavu doporučeno H.264, 720p nebo rozumné 1080p.</span></div></div>`;
    setTimeout(updateScrollAid, 0);
    return;
  }
  try{
    const blob = await idbGet(p.videoKey);
    if(!blob) throw new Error("blob missing");
    const url = URL.createObjectURL(blob);
    pane.innerHTML = `<div class="videoBox"><video src="${url}" controls playsinline></video></div>`;
    setTimeout(updateScrollAid, 0);
  }catch(e){
    pane.innerHTML = `<div class="videoBox"><div class="emptyVideo"><b>Video se nepovedlo načíst</b><span>Soubor v úložišti chybí nebo ho prohlížeč nemůže přehrát.</span></div></div>`;
    setTimeout(updateScrollAid, 0);
  }
}
function setActiveTab(){

      <div class="card">
        <h3>Obrázky produktu</h3>
        <label>URL obrázků, každý na nový řádek</label>
        <textarea id="fImages">${escapeHtml((p.images||[]).map(x => imageSrc(x)).join("\\n"))}</textarea>
        <div class="adminActions">
          <button class="btn" id="saveImages">Uložit obrázky</button>
        </div>
        <p class="hint">Teď je to připravené pro ruční URL. Backend sem později pošle pole obrázků automaticky z produktové stránky.</p>
      </div>

      <div class="card">
        <h3>Video k produktu</h3>
        <label>Nahrát MP4 / WEBM</label>
        <input id="videoFile" type="file" accept="video/mp4,video/webm,video/*" />
        <div class="adminActions">
          <button class="btn" id="saveVideo">Uložit video do tabletu</button>
          <button class="btn danger" id="removeVideo">Odebrat video</button>
        </div>
        <p class="hint">V ostré verzi půjdou videa do tabletu importem ZIP balíčku s manifest.json.</p>
      </div>

      <div class="card">
        <h3>Produkty</h3>
        <div id="productList"></div>
        <div class="adminActions">
          <button class="btn" id="addProduct">Přidat produkt</button>
          <button class="btn ghost" id="exportJson">Export JSON</button>
          <button class="btn danger" id="resetData">Reset prototypu</button>
        </div>
      </div>

      <div class="card">
        <h3>Nastavení adminu</h3>
        <label>Změnit PIN</label>
        <input id="newPin" type="password" inputmode="numeric" placeholder="Nový PIN" />
        <div class="adminActions"><button class="btn" id="savePin">Uložit PIN</button></div>
        <p class="hint">V ostré verzi bychom měli login přes backend, role a audit změn. PIN je pohodlný pro lokální kiosk, ale není to bankovní trezor.</p>
      </div>
    </div>`;
  renderProductList();
  bindAdmin();
  bindDeviceSettingsControls();
  updateAdminBrandPreview();
  updateDeviceSettingsPreview();
}
function updateAdminBrandPreview(){
  const sel = el("fBrand");
  if(!sel) return;
  const data = BRAND_COLORS[sel.value] || BRAND_COLORS.Hisense;
  document.querySelectorAll(".brandSwatch").forEach(s => s.style.background = data.hex);
  const t = el("brandColorText");
  if(t) t.textContent = `${data.label}: RGB ${data.rgb.replaceAll(",", " / ")}`;
}
function readCheckedValues(setting){
  return Array.from(document.querySelectorAll(`input[data-setting="${setting}"]:checked`)).map(x => x.value);
}
function currentDeviceSettingsFromAdmin(){
  return {
    deviceName: (el("deviceName")?.value || "").trim() || DEFAULT_DEVICE_SETTINGS.deviceName,
    deviceId: (el("deviceId")?.value || "").trim() || DEFAULT_DEVICE_SETTINGS.deviceId,
    apiBase: (el("apiBase")?.value || "").trim() || DEFAULT_API_BASE,
    useSupabase: !!el("useSupabase")?.checked,
    displayMode: el("displayMode")?.value || "all",
    brands: readCheckedValues("brand"),
    categories: readCheckedValues("category"),
    productIds: readCheckedValues("product")
  };
}
function updateDeviceSettingsPreview(){
  const mode = el("displayMode");
  if(!mode) return;
  const settings = currentDeviceSettingsFromAdmin();
  const count = productCountForSettings(settings);
  const modeLabel = settings.useSupabase ? "Supabase device profil" : (DISPLAY_MODES[settings.displayMode] || "Všechny produkty");
  if(el("summaryMode")) el("summaryMode").textContent = modeLabel;
  if(el("summaryCount")) el("summaryCount").textContent = count;
}
function bindDeviceSettingsControls(){
  const ids = ["deviceName", "deviceId", "apiBase", "displayMode"];
  ids.forEach(id => {
    const node = el(id);
    if(node) node.addEventListener("input", updateDeviceSettingsPreview);
    if(node) node.addEventListener("change", updateDeviceSettingsPreview);
  });
  document.querySelectorAll('input[data-setting]').forEach(input => {
    input.addEventListener("change", updateDeviceSettingsPreview);
  });
  if(el("useSupabase")) el("useSupabase").addEventListener("change", updateDeviceSettingsPreview);
  if(el("saveDeviceSettings")){
    el("saveDeviceSettings").onclick = () => {
      state.deviceSettings = currentDeviceSettingsFromAdmin();
      state.current = 0;
      saveDeviceSettings();
      render();
      if(state.deviceSettings.useSupabase){
        loadRemoteConfig(true).then(()=>{ if(el("adminOverlay").classList.contains("open")) renderAdmin(); });
      } else {
        renderAdmin();
        toast("Nastavení tabletu uloženo.");
      }
    };
  }
  if(el("syncNow")){
    el("syncNow").onclick = () => {
      state.deviceSettings = currentDeviceSettingsFromAdmin();
      state.deviceSettings.useSupabase = true;
      state.current = 0;
      saveDeviceSettings();
      loadRemoteConfig(true).then(()=>{ if(el("adminOverlay").classList.contains("open")) renderAdmin(); });
    };
  }
  if(el("showAllProducts")){
    el("showAllProducts").onclick = () => {
      state.deviceSettings = {...DEFAULT_DEVICE_SETTINGS, useSupabase:false, displayMode:"all", brands:["Hisense"], categories:[], productIds:[], deviceName: el("deviceName")?.value || DEFAULT_DEVICE_SETTINGS.deviceName, deviceId: el("deviceId")?.value || DEFAULT_DEVICE_SETTINGS.deviceId, apiBase: el("apiBase")?.value || DEFAULT_API_BASE};
      state.current = 0;
      saveDeviceSettings();
      render();
      renderAdmin();
      toast("Lokální režim: zobrazuju všechny produkty z cache.");
    };
  }
}

function renderProductList(){
  const list = el("productList");
  list.innerHTML = "";
  state.products.forEach((p,i)=>{
    const row = document.createElement("div");
    row.className = "spec";
    row.style.marginBottom = "9px";
    row.innerHTML = `<span class="k">${escapeHtml(p.model || p.title || "Produkt")} <small style="color:var(--muted)">(${escapeHtml(p.brand || "Hisense")})</small></span><span class="v">${p.active!==false ? "Aktivní" : "Skrytý"}</span>`;
    row.onclick = () => {
      const activeIndex = activeProducts().findIndex(x=>x.id===p.id);
      state.current = Math.max(0, activeIndex);
      render();
      renderAdmin();
    };
    list.appendChild(row);
  });
}
function bindAdmin(){
  el("fBrand").onchange = () => {
    applyBrand(el("fBrand").value);
    updateAdminBrandPreview();
  };
  el("saveCurrent").onclick = ()=>{
    const p = product() || state.products[0];
    Object.assign(p, {
      brand:el("fBrand").value,
      model:el("fModel").value.trim(),
      dmoc:el("fDmoc").value.trim(),
      title:el("fTitle").value.trim(),
      category:el("fCategory").value.trim(),
      url:el("fUrl").value.trim(),
      intro:el("fIntro").value.trim()
    });
    saveProducts(); render(); toast("Uloženo.");
  };
  el("saveImages").onclick = ()=>{
    const p = product() || state.products[0];
    const urls = el("fImages").value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
    p.images = urls.map((url,i)=>({label:`Obrázek ${i+1}`, url}));
    p.imageIndex = 0;
    saveProducts(); render(); toast("Obrázky uloženy.");
  };
  el("fakeSync").onclick = ()=>loadRemoteConfig(true);
  el("saveVideo").onclick = async ()=>{
    const file = el("videoFile").files[0];
    if(!file){ toast("Vyber video soubor."); return; }
    const p = product() || state.products[0];
    const key = "video-" + p.id;
    await idbSet(key, file);
    p.videoKey = key;
    saveProducts(); render(); toast("Video uloženo do tabletu.");
  };
  el("removeVideo").onclick = async ()=>{
    const p = product() || state.products[0];
    if(p.videoKey) await idbDelete(p.videoKey);
    p.videoKey = null; saveProducts(); render(); toast("Video odebráno.");
  };
  el("addProduct").onclick = ()=>{
    const id = "product-" + Date.now();
    state.products.push({
      id, active:true, brand:"Hisense", category:"Nový produkt", model:"MODEL", title:"Nový produkt",
      dmoc:"—", url:"", intro:"Krátký popis produktu.", features:[], specs:[], images:[], imageIndex:0, videoKey:null
    });
    state.current = activeProducts().length - 1;
    saveProducts(); render(); renderAdmin(); toast("Produkt přidán.");
  };
  el("exportJson").onclick = ()=>{
    const blob = new Blob([JSON.stringify(state.products,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "exhibit-products.json"; a.click();
    URL.revokeObjectURL(a.href);
  };
  el("resetData").onclick = ()=>{
    if(confirm("Resetovat lokální data prototypu?")){
      localStorage.removeItem("products_cache_v11"); localStorage.removeItem("device_settings_v11"); location.reload();
    }
  };
  el("savePin").onclick = ()=>{
    const v = el("newPin").value.trim();
    if(v.length < 4){ toast("PIN dej aspoň 4 znaky."); return; }
    state.pin = v; localStorage.setItem("adminPin", v); toast("PIN změněn.");
  };
}

el("closeAdmin").onclick = ()=>{ el("adminOverlay").classList.remove("open"); render(); };
el("adminHotspot").addEventListener("click", ()=>{
  state.tapCount++;
  clearTimeout(state.tapTimer);
  state.tapTimer = setTimeout(()=>state.tapCount=0, 1200);
  if(state.tapCount >= 5){ state.tapCount=0; openPin(); }
});
let pressTimer;
el("brandHotspot").addEventListener("pointerdown", ()=>{ pressTimer=setTimeout(openPin, 1800); });
el("brandHotspot").addEventListener("pointerup", ()=>clearTimeout(pressTimer));
el("brandHotspot").addEventListener("pointerleave", ()=>clearTimeout(pressTimer));

let idleTimer;
function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{
    if(el("adminOverlay").classList.contains("open")){
      el("adminOverlay").classList.remove("open");
      toast("Admin se zamkl po nečinnosti.");
    }
    state.tab = "overview"; setActiveTab(); renderPane();
  }, 120000);
}
["pointerdown","keydown","touchstart"].forEach(ev=>window.addEventListener(ev, resetIdle, {passive:true}));
resetIdle();

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function attr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }

function openDb(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>req.result.createObjectStore(DB_STORE);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await openDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(val, key);
    tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGet(key){
  const db = await openDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbDelete(key){
  const db = await openDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
  });
}

function updateScrollAid(){
  const pane = el("pane");
  const aid = el("scrollAid");
  const thumb = el("scrollThumb");
  const up = el("scrollUp");
  const down = el("scrollDown");
  const track = el("scrollTrack");
  if(!pane || !aid || !thumb || !track) return;

  const max = Math.max(0, pane.scrollHeight - pane.clientHeight);
  if(max <= 8){
    aid.classList.add("hidden");
    return;
  }
  aid.classList.remove("hidden");

  const trackH = Math.max(1, track.clientHeight - 14);
  const ratio = pane.clientHeight / Math.max(pane.scrollHeight, 1);
  const thumbH = Math.max(34, Math.round(trackH * ratio));
  const travel = Math.max(0, trackH - thumbH);
  const top = 7 + Math.round(travel * (pane.scrollTop / max));

  thumb.style.height = thumbH + "px";
  thumb.style.top = top + "px";
  up.disabled = pane.scrollTop <= 2;
  down.disabled = pane.scrollTop >= max - 2;
}
function scrollPaneBy(direction){
  const pane = el("pane");
  if(!pane) return;
  pane.scrollBy({top: direction * Math.max(160, pane.clientHeight * .72), behavior:"smooth"});
}
function bindScrollAid(){
  const pane = el("pane");
  const up = el("scrollUp");
  const down = el("scrollDown");
  const track = el("scrollTrack");
  if(!pane || !up || !down || !track) return;

  up.onclick = () => scrollPaneBy(-1);
  down.onclick = () => scrollPaneBy(1);

  pane.addEventListener("scroll", updateScrollAid, {passive:true});
  window.addEventListener("resize", updateScrollAid);

  track.addEventListener("pointerdown", (e)=>{
    if(e.target && e.target.id === "scrollThumb") return;
    const rect = track.getBoundingClientRect();
    const rel = Math.min(Math.max(e.clientY - rect.top, 0), rect.height);
    const pane = el("pane");
    const max = Math.max(0, pane.scrollHeight - pane.clientHeight);
    pane.scrollTo({top: max * (rel / Math.max(rect.height,1)), behavior:"smooth"});
  });
}

bindScrollAid();
render();
if(state.deviceSettings.useSupabase){
  setTimeout(()=>loadRemoteConfig(false), 120);
}
</script>
