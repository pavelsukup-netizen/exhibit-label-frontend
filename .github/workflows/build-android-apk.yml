name: Build Android kiosk APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-kiosk/**"
      - "index.html"
      - "assets/**"
      - "data/products-*.js"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate web catalog
        run: node scripts/validate-catalog.mjs

      - name: Build debug APK
        working-directory: android-kiosk
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature and bundled catalog
        run: |
          APK="android-kiosk/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -p "$APK" assets/web/data/products-hisense-av.js | grep -q '"65UR9S"'
          unzip -p "$APK" assets/web/data/products-hisense-av.js | grep -q '"HS3100"'
          unzip -p "$APK" assets/web/index.html | grep -q 'Nahrát video ze zařízení'
          unzip -p "$APK" classes.dex > classes.dex
          grep -a -q 'product-videos' classes.dex

      - name: Prepare artifact
        run: cp android-kiosk/app/build/outputs/apk/debug/app-debug.apk ExhibitCatalog-0.2.0-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ExhibitCatalog-APK
          path: ExhibitCatalog-0.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
